<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daniel A. Schulze | My Profiles</title>
  <style>
        /* CSS Variables */
        :root {
            --bsky-color: #01A6FF;
            --linkedin-color: #0A66C2;
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.3);
            --text-color: #ffffff;
        }

        /* Basic Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Animated Gradient Background */
        body {
            background: linear-gradient(-45deg, #1f2937, #4f46e5, #0ea5e9, #0f172a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Ambient floating orbs for extra depth */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.6;
        }
        .orb-1 {
            width: 300px;
            height: 300px;
            background: #e81cff;
            top: -50px;
            left: -50px;
            animation: float 8s ease-in-out infinite;
        }
        .orb-2 {
            width: 400px;
            height: 400px;
            background: #40c9ff;
            bottom: -100px;
            right: -100px;
            animation: float 10s ease-in-out infinite reverse;
        }

        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(30px) scale(1.1); }
            100% { transform: translateY(0px) scale(1); }
        }

        /* Glassmorphism Card Container */
        .card-container {
            position: relative;
            z-index: 10;
            max-width: 420px;
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 45px 35px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            text-align: center;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card-container.visible {
            opacity: 1;
            transform: scale(1);
        }

        /* Profile Avatar */
        .avatar {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, rgba(255,255,255,0.4), rgba(255,255,255,0.1));
            border: 2px solid var(--glass-border);
            border-radius: 50%;
            margin: 0 auto 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        /* Typography */
        h1 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .welcome-text {
            font-size: 16px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 35px;
            font-weight: 400;
        }

        /* Links/Buttons Layout */
        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-bottom: 35px;
        }

        .social-btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 18px;
            border-radius: 16px;
            text-decoration: none;
            color: #ffffff;
            font-weight: 600;
            font-size: 16px;
            letter-spacing: 0.5px;
            overflow: hidden;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .social-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(255,255,255,0.2), rgba(255,255,255,0));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .social-btn:hover::before {
            opacity: 1;
        }

        .social-btn:active {
            transform: scale(0.96);
        }

        .btn-linkedin {
            background-color: var(--linkedin-color);
            box-shadow: 0 8px 25px rgba(10, 102, 194, 0.4);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-bluesky {
            background-color: var(--bsky-color);
            box-shadow: 0 8px 25px rgba(1, 166, 255, 0.4);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Dynamic SVG Scaling Fix */
        .social-btn svg {
            height: 24px;
            width: auto;
            fill: currentColor;
            z-index: 1;
        }
        
        .social-btn span {
            z-index: 1;
        }

        /* Call to Action Badge */
        .cta-wrapper {
            background: linear-gradient(135deg, rgba(255,255,255,0.2), rgba(255,255,255,0.05));
            border: 1px solid var(--glass-border);
            padding: 16px;
            border-radius: 16px;
            display: inline-block;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .cta-text {
            font-weight: 700;
            font-size: 18px;
            color: #ffffff;
            text-shadow: 0 1px 5px rgba(0,0,0,0.2);
        }

    /* Bundler/load placeholder styles (preserved from current branch) */
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: transparent; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>

</head>
<body>
  <div id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" sc-camel-view-box="0 0 100 100"><rect width="100" height="100" fill="#0f2a20"></rect><g stroke="#6ee7b7" fill="none" stroke-width="2.4"><circle cx="50" cy="50" r="15"></circle><g stroke-linecap="round"><path d="M50 35v-8M50 65v8M35 50h-8M65 50h8M39.4 39.4l-5.7-5.7M60.6 60.6l5.7 5.7M60.6 39.4l5.7-5.7M39.4 60.6l-5.7 5.7"></path></g></g><g fill="#6ee7b7"><circle cx="50" cy="24" r="3.2"></circle><circle cx="50" cy="76" r="3.2"></circle><circle cx="24" cy="50" r="3.2"></circle><circle cx="76" cy="50" r="3.2"></circle><circle cx="31.6" cy="31.6" r="3.2"></circle><circle cx="68.4" cy="68.4" r="3.2"></circle><circle cx="68.4" cy="31.6" r="3.2"></circle><circle cx="31.6" cy="68.4" r="3.2"></circle></g></svg></div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

r(--bg); }\n  @media (pointer: fine) { *, html, body { cursor: none !important; } }\n  * { box-sizing: border-box; }\n  a { color: inherit; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; text-decoration-thickness: 1px; transition: text-decoration-color .18s ease; }\n  a:hover { text-decoration-color: var(--fg); }\n  ::selection { background: var(--tint); }\n  @keyframes typeIn { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 -3px 0 0); } }\n  @keyframes sparkIn { from { opacity: 0; } to { opacity: 1; } }\n  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div data-theme=\"{{ theme }}\" style=\"min-height: 100vh; background: var(--bg); color: var(--fg); font-family: 'Newsreader', Georgia, serif; font-size: 16px; line-height: 1.62; -webkit-font-smoothing: antialiased; transition: background .4s ease, color .4s ease; display: flex; justify-content: center; padding: clamp(22px, 5vw, 46px) clamp(20px, 6vw, 40px) 90px;\">\n  <div ref=\"{{ cursorRef }}\" style=\"position: fixed; top: 0; left: 0; width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px; border-radius: 999px; background: var(--fg); border: 1.5px solid transparent; pointer-events: none; z-index: 90; opacity: 0; will-change: transform; transition: opacity .3s ease, width .26s cubic-bezier(.32,.72,0,1), height .26s cubic-bezier(.32,.72,0,1), margin .26s cubic-bezier(.32,.72,0,1), border-radius .26s ease, background .2s ease, border-color .2s ease;\"><\u002Fdiv>\n\n  <div style=\"width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 28px;\">\n\n    <div style=\"display: flex; justify-content: flex-end;\">\n      <button sc-camel-on-click=\"{{ toggleTheme }}\" title=\"press D\" style=\"cursor: pointer; background: none; border: 0; padding: 2px 0; font-family: 'Fragment Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.1em; color: var(--faint); transition: color .2s ease;\" style-hover=\"color: var(--fg);\">{{ themeLabel }}<\u002Fbutton>\n    <\u002Fdiv>\n\n    <header style=\"display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-top: -12px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 2px;\">\n        <h1 style=\"margin: 0 0 1px; font-family: 'Neue Haas Display', 'Space Grotesk', Helvetica, sans-serif; font-size: 34px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.12;\">Daniel A. Schulze<\u002Fh1>\n        <p style=\"margin: 0; font-size: 17px; color: var(--dim);\">MSc Biomedicine Student, Karolinska Institutet - Stockholm<\u002Fp>\n      <\u002Fdiv>\n      <div title=\"{{ glyphTitle }}\" sc-camel-on-mouse-enter=\"{{ onGlyphIn }}\" sc-camel-on-mouse-leave=\"{{ onGlyphOut }}\" sc-camel-on-click=\"{{ onGlyphClick }}\" style=\"cursor: pointer; flex: none; user-select: none; padding: 0 0 0 8px; opacity: {{ glyphOpacity }}; transition: opacity .5s ease;\">\n        <pre style=\"margin: 0; font-family: 'Fragment Mono', ui-monospace, monospace; font-size: 9.5px; line-height: 1.02; letter-spacing: 0.04em; color: var(--accent); white-space: pre;\">{{ glyph }}<\u002Fpre>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <p style=\"margin: 0; text-wrap: pretty;\">I'm curius about what makes us sick (so far mostly RNA viruses) as well as how the immune system takes them apart. I did my <span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ toggle.studies }}\" sc-camel-on-key-down=\"{{ key.studies }}\" style=\"cursor: pointer; border-bottom: 1px dashed var(--faint); padding: 0 1px; transition: border-color .2s ease;\" style-hover=\"border-bottom-color: var(--fg);\">studies<\u002Fspan> in Braunschweig (Germany), London (UK) and Stockholm (Sweden).<\u002Fp>\n\n    <!-- ── STUDIES ────────────────────────────────────────────────────────\n         COLLAPSIBLE PATTERN — copy this block to add a new one:\n           1. inline trigger in the paragraph above:\n              sc-camel-on-click=\"{{ toggle.<id> }}\"  sc-camel-on-key-down=\"{{ key.<id> }}\"\n           2. this wrapper, with grid-template-rows: {{ rows.<id> }},\n              <sc-if value=\"{{ mounted.<id> }}\"> and list=\"{{ tree.<id> }}\"\n           3. the lines themselves in PANELS.<id>, down in the script\n         The row markup below never changes — it renders whatever PANELS holds,\n         and no ids need registering anywhere. -->\n    <div style=\"display: grid; grid-template-rows: {{ rows.studies }}; transition: grid-template-rows .42s cubic-bezier(.32,.72,0,1); margin-top: -16px;\">\n      <div style=\"overflow: hidden;\">\n        <sc-if value=\"{{ mounted.studies }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"padding-top: 14px; display: grid; grid-template-columns: auto 1fr; column-gap: 10px; row-gap: 6px; font-family: 'Fragment Mono', ui-monospace, monospace; font-size: 14.5px; line-height: 1.55;\">\n            <sc-for list=\"{{ tree.studies }}\" as=\"row\"><span style=\"color: var(--faint); white-space: pre; align-self: {{ row.align }}; animation: typeIn .4s steps(26, end) both {{ row.delay }};\">{{ row.prefix }}<\u002Fspan><span style=\"color: {{ row.color }}; white-space: pre-wrap; animation: typeIn .4s steps(26, end) both {{ row.delay }};\"><sc-if value=\"{{ row.before }}\">{{ row.before }}<\u002Fsc-if><sc-if value=\"{{ row.href }}\"><a href=\"{{ row.href }}\" target=\"{{ row.target }}\" rel=\"{{ row.rel }}\">{{ row.a }}<\u002Fa><\u002Fsc-if><sc-if value=\"{{ row.after }}\">{{ row.after }}<\u002Fsc-if><\u002Fspan><\u002Fsc-for>\n          <\u002Fdiv>\n<div ref=\"{{ tedRef }}\" style=\"height: 1px;\"><\u002Fdiv>\n          <sc-if value=\"{{ tedShell }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: grid; grid-template-rows: {{ tedHintRows }}; opacity: {{ tedHintOpacity }}; transition: grid-template-rows .4s cubic-bezier(.32,.72,0,1), opacity .3s ease;\">\n            <div style=\"overflow: hidden;\">\n              <div style=\"padding-top: 14px; display: grid; grid-template-columns: auto 1fr; column-gap: 10px; font-family: 'Fragment Mono', ui-monospace, monospace; font-size: 14.5px; line-height: 1.55;\"><span style=\"white-space: pre;\">  <\u002Fspan><span style=\"color: var(--dim); white-space: pre-wrap; animation: typeIn .5s steps(30, end) both;\">opening {{ tedLabel }}  {{ tedDots }}<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-rows: {{ tedRows }}; opacity: {{ tedOpacity }}; transition: grid-template-rows .55s cubic-bezier(.32,.72,0,1), opacity .45s ease .06s;\">\n          <div style=\"overflow: hidden; transform: {{ tedLift }}; transition: transform .55s cubic-bezier(.32,.72,0,1);\">\n          <a href=\"https://tedxki.com\" target=\"_blank\" rel=\"noopener\" tabindex=\"{{ tedTab }}\" sc-camel-on-mouse-enter=\"{{ onTedIn }}\" sc-camel-on-mouse-leave=\"{{ onTedOut }}\" style=\"display: block; margin-top: 18px; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--bg); text-decoration: none; transition: border-color .25s ease, transform .35s cubic-bezier(.32,.72,0,1);\" style-hover=\"border-color: var(--accent); transform: translateY(-2px);\">\n            <div style=\"display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-bottom: 1px solid var(--line); font-family: 'Fragment Mono', monospace; font-size: 10.5px; color: var(--faint);\">\n              <span style=\"display: flex; gap: 5px; flex: none;\"><span style=\"width: 8px; height: 8px; border-radius: 999px; border: 1px solid var(--faint); display: block;\"><\u002Fspan><span style=\"width: 8px; height: 8px; border-radius: 999px; border: 1px solid var(--faint); display: block;\"><\u002Fspan><span style=\"width: 8px; height: 8px; border-radius: 999px; border: 1px solid var(--faint); display: block;\"><\u002Fspan><\u002Fspan>\n              <span style=\"flex: 1; text-align: center; letter-spacing: 0.04em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\">tedxki.com<\u002Fspan>\n              <span style=\"flex: none; opacity: {{ tedArrow }}; transition: opacity .25s ease;\">↗<\u002Fspan>\n            <\u002Fdiv>\n            <div ref=\"{{ tedBoxRef }}\" style=\"position: relative; height: {{ tedH }}px; overflow: hidden; background: var(--bg);\">\n              <iframe src=\"https://tedxki.com\" title=\"TEDx Karolinska Institutet\" scrolling=\"no\" tabindex=\"-1\" sc-camel-on-load=\"{{ tedLoad }}\" style=\"position: absolute; top: 0; left: 0; width: {{ tedVW }}px; height: {{ tedVH }}px; border: 0; transform: scale({{ tedScale }}); transform-origin: 0 0; pointer-events: none;\"><\u002Fiframe>\n              <div style=\"position: absolute; inset: 0;\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fa>\n          <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <p style=\"margin: 0; text-wrap: pretty;\">Next to my studies, I worked for about 3 years in the <a href=\"https://www.helmholtz-hzi.de/en/research/research-groups/details/epidemiology/\" target=\"_blank\" rel=\"noopener\">infectious disease epidemiology<\u002Fa> at HZI as student research assistant on multiple <span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ toggle.jobs }}\" sc-camel-on-key-down=\"{{ key.jobs }}\" style=\"cursor: pointer; border-bottom: 1px dashed var(--faint); padding: 0 1px; transition: border-color .2s ease;\" style-hover=\"border-bottom-color: var(--fg);\">projects and studies<\u002Fspan>.<\u002Fp>\n\n    <div style=\"display: grid; grid-template-rows: {{ rows.jobs }}; transition: grid-template-rows .42s cubic-bezier(.32,.72,0,1); margin-top: -16px;\">\n      <div style=\"overflow: hidden;\">\n        <sc-if value=\"{{ mounted.jobs }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"padding-top: 14px; display: grid; grid-template-columns: auto 1fr; column-gap: 10px; row-gap: 6px; font-family: 'Fragment Mono', ui-monospace, monospace; font-size: 14.5px; line-height: 1.55;\">\n            <sc-for list=\"{{ tree.jobs }}\" as=\"row\"><span style=\"color: var(--faint); white-space: pre; align-self: {{ row.align }}; animation: typeIn .4s steps(26, end) both {{ row.delay }};\">{{ row.prefix }}<\u002Fspan><span style=\"color: {{ row.color }}; white-space: pre-wrap; animation: typeIn .4s steps(26, end) both {{ row.delay }};\"><sc-if value=\"{{ row.before }}\">{{ row.before }}<\u002Fsc-if><sc-if value=\"{{ row.href }}\"><a href=\"{{ row.href }}\" target=\"{{ row.target }}\" rel=\"{{ row.rel }}\">{{ row.a }}<\u002Fa><\u002Fsc-if><sc-if value=\"{{ row.after }}\">{{ row.after }}<\u002Fsc-if><\u002Fspan><\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <p style=\"margin: 0; text-wrap: pretty;\">In 2023 I was 1/8 of ouruniversity's <span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ toggle.igem }}\" sc-camel-on-key-down=\"{{ key.igem }}\" style=\"cursor: pointer; border-bottom: 1px dashed var(--faint); padding: 0 1px; transition: border-color .2s ease;\" style-hover=\"border-bottom-color: var(--fg);\">iGEM team<\u002Fspan>, laying a the foundation for a point-of-care test for lithium quantification.<\u002Fp>\n\n    <div style=\"display: grid; grid-template-rows: {{ rows.igem }}; transition: grid-template-rows .42s cubic-bezier(.32,.72,0,1); margin-top: -16px;\">\n      <div style=\"overflow: hidden;\">\n        <sc-if value=\"{{ mounted.igem }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"padding-top: 14px; display: grid; grid-template-columns: auto 1fr; column-gap: 10px; row-gap: 6px; font-family: 'Fragment Mono', ui-monospace, monospace; font-size: 14.5px; line-height: 1.55;\">\n            <sc-for list=\"{{ tree.igem }}\" as=\"row\"><span style=\"color: var(--faint); white-space: pre; align-self: {{ row.align }}; animation: typeIn .4s steps(26, end) both {{ row.delay }};\">{{ row.prefix }}<\u002Fspan><span style=\"color: {{ row.color }}; white-space: pre-wrap; animation: typeIn .4s steps(26, end) both {{ row.delay }};\"><sc-if value=\"{{ row.before }}\">{{ row.before }}<\u002Fsc-if><sc-if value=\"{{ row.href }}\"><a href=\"{{ row.href }}\" target=\"{{ row.target }}\" rel=\"{{ row.rel }}\">{{ row.a }}<\u002Fa><\u002Fsc-if><sc-if value=\"{{ row.after }}\">{{ row.after }}<\u002Fsc-if><\u002Fspan><\u002Fsc-for>\n          <\u002Fdiv>\n          <!-- Live preview window: an inert, scaled iframe behind a click-through overlay.\n               It is built offstage (row 0fr, opacity 0) and only wipes open once the\n               remote page has painted, so the frame is never seen empty. -->\n<div ref=\"{{ igemRef }}\" style=\"height: 1px;\"><\u002Fdiv>\n          <sc-if value=\"{{ igemShell }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: grid; grid-template-rows: {{ igemHintRows }}; opacity: {{ igemHintOpacity }}; transition: grid-template-rows .4s cubic-bezier(.32,.72,0,1), opacity .3s ease;\">\n            <div style=\"overflow: hidden;\">\n              <div style=\"padding-top: 14px; display: grid; grid-template-columns: auto 1fr; column-gap: 10px; font-family: 'Fragment Mono', ui-monospace, monospace; font-size: 14.5px; line-height: 1.55;\"><span style=\"white-space: pre;\">  <\u002Fspan><span style=\"color: var(--dim); white-space: pre-wrap; animation: typeIn .5s steps(30, end) both;\">opening {{ igemLabel }}  {{ igemDots }}<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-rows: {{ igemRows }}; opacity: {{ igemOpacity }}; transition: grid-template-rows .55s cubic-bezier(.32,.72,0,1), opacity .45s ease .06s;\">\n          <div style=\"overflow: hidden; transform: {{ igemLift }}; transition: transform .55s cubic-bezier(.32,.72,0,1);\">\n          <a href=\"https://2023.igem.wiki/tu-braunschweig/index.html\" target=\"_blank\" rel=\"noopener\" tabindex=\"{{ igemTab }}\" sc-camel-on-mouse-enter=\"{{ onFrameIn }}\" sc-camel-on-mouse-leave=\"{{ onFrameOut }}\" style=\"display: block; margin-top: 18px; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--bg); text-decoration: none; transition: border-color .25s ease, transform .35s cubic-bezier(.32,.72,0,1);\" style-hover=\"border-color: var(--accent); transform: translateY(-2px);\">\n            <div style=\"display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-bottom: 1px solid var(--line); font-family: 'Fragment Mono', monospace; font-size: 10.5px; color: var(--faint);\">\n              <span style=\"display: flex; gap: 5px; flex: none;\"><span style=\"width: 8px; height: 8px; border-radius: 999px; border: 1px solid var(--faint); display: block;\"><\u002Fspan><span style=\"width: 8px; height: 8px; border-radius: 999px; border: 1px solid var(--faint); display: block;\"><\u002Fspan><span style=\"width: 8px; height: 8px; border-radius: 999px; border: 1px solid var(--faint); display: block;\"><\u002Fspan><\u002Fspan>\n              <span style=\"flex: 1; text-align: center; letter-spacing: 0.04em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\">2023.igem.wiki/tu-braunschweig<\u002Fspan>\n              <span style=\"flex: none; opacity: {{ frameArrow }}; transition: opacity .25s ease;\">↗<\u002Fspan>\n            <\u002Fdiv>\n            <div ref=\"{{ igemBoxRef }}\" style=\"position: relative; height: {{ igemH }}px; overflow: hidden; background: var(--bg);\">\n              <iframe src=\"https://2023.igem.wiki/tu-braunschweig/index.html\" title=\"iGEM TU Braunschweig 2023 wiki\" scrolling=\"no\" tabindex=\"-1\" sc-camel-on-load=\"{{ igemLoad }}\" style=\"position: absolute; top: 0; left: 0; width: {{ igemVW }}px; height: {{ igemVH }}px; border: 0; transform: scale({{ igemScale }}); transform-origin: 0 0; pointer-events: none;\"><\u002Fiframe>\n              <div style=\"position: absolute; inset: 0;\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fa>\n          <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <p style=\"margin: 0; text-wrap: pretty;\">On the side I wrote a small tool to stay on top of my literature. If you use Zotero, check out my <a href=\"https://github.com/schulzedaniel/ZoteroCitationMaps\" target=\"_blank\" rel=\"noopener\">plugin<\u002Fa>, that maps out how your papers in your collection are connected and suggests you papers you might have missed. (More cool stuff happening there soon, stay psyched..)<\u002Fp>\n\n    <div style=\"display: grid; grid-template-rows: {{ rows.zotero }}; transition: grid-template-rows .42s cubic-bezier(.32,.72,0,1); margin-top: -16px;\">\n      <div style=\"overflow: hidden;\">\n        <sc-if value=\"{{ mounted.zotero }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"padding-top: 14px; display: grid; grid-template-columns: auto 1fr; column-gap: 10px; row-gap: 6px; font-family: 'Fragment Mono', ui-monospace, monospace; font-size: 14.5px; line-height: 1.55;\">\n            <sc-for list=\"{{ tree.zotero }}\" as=\"row\"><span style=\"color: var(--faint); white-space: pre; align-self: {{ row.align }}; animation: typeIn .4s steps(26, end) both {{ row.delay }};\">{{ row.prefix }}<\u002Fspan><span style=\"color: {{ row.color }}; white-space: pre-wrap; animation: typeIn .4s steps(26, end) both {{ row.delay }};\"><sc-if value=\"{{ row.before }}\">{{ row.before }}<\u002Fsc-if><sc-if value=\"{{ row.href }}\"><a href=\"{{ row.href }}\" target=\"{{ row.target }}\" rel=\"{{ row.rel }}\">{{ row.a }}<\u002Fa><\u002Fsc-if><sc-if value=\"{{ row.after }}\">{{ row.after }}<\u002Fsc-if><\u002Fspan><\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <p style=\"margin: 0; text-wrap: pretty;\">If any of this overlaps with what you're working on or if you want to start something new, I'm always happy when you reach out and <span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ toggle.reach }}\" sc-camel-on-key-down=\"{{ key.reach }}\" style=\"cursor: pointer; border-bottom: 1px dashed var(--faint); padding: 0 1px; transition: border-color .2s ease;\" style-hover=\"border-bottom-color: var(--fg);\">write me<\u002Fspan>!<\u002Fp>\n\n    <div style=\"display: grid; grid-template-rows: {{ rows.reach }}; transition: grid-template-rows .42s cubic-bezier(.32,.72,0,1); margin-top: -16px;\">\n      <div style=\"overflow: hidden;\">\n        <sc-if value=\"{{ mounted.reach }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"padding-top: 14px; display: grid; grid-template-columns: auto 1fr; column-gap: 10px; row-gap: 6px; font-family: 'Fragment Mono', ui-monospace, monospace; font-size: 14.5px; line-height: 1.55;\">\n            <!-- same row markup as the other panels, plus the two one-off rows\n                 this panel has: the click-to-copy address and the plaque assay -->\n            <sc-for list=\"{{ tree.reach }}\" as=\"row\"><span style=\"color: var(--faint); white-space: pre; align-self: {{ row.align }}; animation: typeIn .4s steps(26, end) both {{ row.delay }};\">{{ row.prefix }}<\u002Fspan><span style=\"color: {{ row.color }}; white-space: pre-wrap; animation: typeIn .4s steps(26, end) both {{ row.delay }};\"><sc-if value=\"{{ row.isLine }}\"><sc-if value=\"{{ row.before }}\">{{ row.before }}<\u002Fsc-if><sc-if value=\"{{ row.href }}\"><a href=\"{{ row.href }}\" target=\"{{ row.target }}\" rel=\"{{ row.rel }}\">{{ row.a }}<\u002Fa><\u002Fsc-if><sc-if value=\"{{ row.after }}\">{{ row.after }}<\u002Fsc-if><\u002Fsc-if><sc-if value=\"{{ row.isMail }}\"><sc-if value=\"{{ mailDone }}\"><a href=\"{{ mailHref }}\" sc-camel-on-click=\"{{ copyMail }}\" title=\"click to copy\">{{ mailAddr }}<\u002Fa><span style=\"color: var(--accent); padding-left: 10px; opacity: {{ copiedOpacity }}; transition: opacity .3s ease;\">{{ copiedNote }}<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ mailPending }}\"><span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ revealMail }}\" sc-camel-on-key-down=\"{{ revealMailKey }}\" style=\"cursor: pointer; color: var(--dim); border-bottom: 1px dashed var(--faint); padding: 0 1px; transition: border-color .2s ease;\" style-hover=\"border-bottom-color: var(--fg);\">{{ mailLabel }}<\u002Fspan><sc-if value=\"{{ mailBusy }}\"><span style=\"color: var(--faint); padding-left: 10px;\">{{ dots }}<\u002Fspan><\u002Fsc-if><span ref=\"{{ turnstileRef }}\" style=\"display: inline-block; vertical-align: middle;\"><\u002Fspan><\u002Fsc-if><\u002Fsc-if><sc-if value=\"{{ row.isPlate }}\"><span sc-camel-on-mouse-enter=\"{{ plateIn }}\" sc-camel-on-click=\"{{ plateIn }}\" title=\"plate it\" style=\"cursor: pointer; display: block; width: max-content; padding: 4px 0 2px;\"><pre style=\"margin: 0; font-family: 'Fragment Mono', ui-monospace, monospace; font-size: 9px; line-height: 1; letter-spacing: 0; color: var(--dim); white-space: pre;\">{{ plate }}<\u002Fpre><\u002Fspan><\u002Fsc-if><\u002Fspan><\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <footer style=\"margin-top: 14px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-family: 'Fragment Mono', ui-monospace, monospace; font-size: 11.5px; letter-spacing: 0.05em; color: var(--faint);\">\n      <span>STOCKHOLM, SE — {{ clock }}<\u002Fspan>\n      <span>DESIGN INSPIRED BY <a href=\"https://marvinvonhagen.com\" target=\"_blank\" rel=\"noopener\">MARVINVONHAGEN.COM<\u002Fa><\u002Fspan>\n    <\u002Ffooter>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;idleMotion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Easter egg&quot;}}\">\nconst W = 19, H = 13;\nconst SPIKES = 10;\nconst GAGS = ['antibody', 'replicate', 'sneeze', 'lysis', 'dizzy'];\n\n/* ══════════════════════════════════════════════════════════════════════════\n   CONTENT — the lists behind each collapsible. This is the only place they\n   are written down; the page below just renders whatever is here.\n\n   One entry per line of the tree. Write a line as:\n\n     'just some text'                                    text, no link\n     { before: 'text ', a: 'Label', href: 'https://…' }  text, then a link\n     { a: 'Label', href: 'https://…', after: ' — more' } a link, then text\n     { before: 'a note', sub: true }                     indented, dimmed\n     { kind: 'mail', a: 'you@example.com' }              click-to-copy address\n     { kind: 'plate' }                                   the plaque-assay egg\n\n   Columns line up with ordinary spaces — what you type is what shows.\n\n   You never write the tree characters or the typing delays: ├─ └─ and the\n   stagger are worked out from each line's position by decorate() below, once\n   at load. Add, remove or reorder lines and the shape follows by itself.\n\n   A link starting with http opens in a new tab; '#' is a placeholder that\n   stays on the page — fill it in when you have the real URL.\n   ══════════════════════════════════════════════════════════════════════════ */\nconst PANELS = {\n  studies: [\n    { before: '2025-now  MSc Biomedicine — ', a: 'Karolinska Institutet, Stockholm', href: 'https://ki.se/en' },\n    { before: 'Research project on Cas-based Andes virus (Hantavirus) diagnostics', sub: true },\n    { before: 'Website Coordinator — ', a: 'TEDxKI (2026)', href: 'https://tedxki.com', sub: true },\n    { before: 'Students Nobel NightCap (2025)', a: '2025', sub: true },\n    { before: '2020-2025 BSc Biology — ', a: 'Technical University of Braunschweig', href: 'https://www.tu-braunschweig.de/en/' },\n    { before: 'iGEM', a: '2023', sub: true },\n    { before: 'Research Intern Barclay Lab — ', a: 'Imperial College London (2023/2024)', href: 'https://www.imperial.ac.uk/barclay-lab/', sub: true },\n    { before: 'Thesis on Interferon mRNA based Influenza Treatment and Immune Evasion — ', a: 'Bruder Lab, HZI (2024/2025)', href: 'https://www.helmholtz-hzi.de/en/research/research-groups/details/immune-regulation/', sub: true }\n  ],\n  jobs: [\n    { a: 'MuSPAD', href: 'https://muspad.de/en/'},\n    { a: 'PIA', href: 'https://helmholtz.software/software/pia'},\n    { a: 'PCR4ALL', href: 'https://www.pcr4all.eu'}\n  ],\n  igem: [\n    'Gold Medal',\n    'Best Diagnostics Project (Overgraduate)',\n    'Top 10 (Overgraduate)',\n    'Nominated — Best new composit part (Overgraduate)',\n    { a: 'Team wiki', href: 'https://2023.igem.wiki/tu-braunschweig/index.html', after: ' — protocols, parts, and the full build log' },\n  ],\n  reach: [\n    { kind: 'mail' },\n    { a: 'LinkedIn', href: 'https://www.linkedin.com/in/daniel-a-schulze-550910205' },\n    { a: 'BlueSky', href: 'https://bsky.app/profile/daniel-schulze.bsky.social' },\n    { a: 'GitHub', href: 'https://github.com/schulzedaniel' },\n    { kind: 'plate' }\n  ]\n};\n\nconst ROW_STEP = 0.16;   // seconds between one line typing in and the next\n\n// Works out everything positional about a list once, at load: the tree\n// characters, how long each line waits before it types, and which of the three\n// row shapes it is. Nothing here is recomputed while the page runs.\nfunction decorate(list) {\n  const rows = list.map(r => (typeof r === 'string' ? { before: r } : r));\n  return rows.map((r, i) => {\n    // a line is the last of its branch when no plain line follows it\n    const lastOfBranch = !rows.slice(i + 1).some(o => !o.sub);\n    const external = /^https?:/i.test(r.href || '');\n    return {\n      prefix: r.sub ? (lastOfBranch ? '   └─' : '│  └─')\n                    : (lastOfBranch ? '└─' : '├─'),\n      delay: (i * ROW_STEP).toFixed(2) + 's',\n      color: r.sub ? 'var(--dim)' : 'inherit',\n      align: r.kind === 'plate' ? 'center' : 'stretch',\n      before: r.before || '',\n      after: r.after || '',\n      a: r.a || '',\n      href: r.href || '',   // the mail row gets its address at runtime, not from here\n      target: external ? '_blank' : '',\n      rel: external ? 'noopener noreferrer' : '',\n      isMail: r.kind === 'mail',\n      isPlate: r.kind === 'plate',\n      isLine: !r.kind\n    };\n  });\n}\n\nconst TREE = Object.fromEntries(Object.keys(PANELS).map(k => [k, decorate(PANELS[k])]));\n\n/* ── CONTACT ADDRESS ───────────────────────────────────────────────────────\n   The address is deliberately NOT in this file. It lives as a secret on a\n   Cloudflare Worker and is only handed over once a Cloudflare Turnstile check\n   passes, so it is in neither the public repo nor the page source for a\n   scraper to find. Worker and Turnstile are both Cloudflare, one account.\n\n   Fill these two in after deploying worker/email-worker.js — see the README.\n   Both are public values by design (the site key is meant to be published);\n   the secret half never leaves Cloudflare. Leave them empty and the row just\n   says the address is unavailable.\n   ─────────────────────────────────────────────────────────────────────── */\nconst MAIL_ENDPOINT = 'https://email-reveal.qsw2qxx84t.workers.dev';\nconst TURNSTILE_KEY = '0x4AAAAAAEEeIaq6f-QhDcql';   // widget \"email-reveal\" (public site key)\n\nconst MAIL_LABEL = {\n  idle: 'show email',\n  busy: 'checking you are human',\n  error: 'could not verify — try again',\n  blocked: 'verification blocked — check your ad blocker',\n  unset: 'email available on request'\n};\n\n// Every failure shows the visitor one short line, but says exactly what went\n// wrong in the console — the difference between a blocked script, a refused\n// origin and a bad token is invisible otherwise.\nfunction m e({ theme });\n  };\n\n  noise(x, y, s) {\n    const n = Math.sin(x * 12.9898 + y * 78.233 + s * 3.71) * 43758.5453;\n    return n - Math.floor(n);\n  }\n\n  // An enveloped virion: membrane, packed genome, and a corona of spike\n  // proteins. Clicking runs one of five gags.\n  buildGlyph(t) {\n    const idle = this.props.idleMotion ?? true;\n    const buf = new Array(W * H).fill(' ');\n    const cx = (W - 1) / 2, cy = (H - 1) / 2;\n    const ax = 0.55;\n    const gag = this.state.gag;\n    const p = Math.min(1, Math.max(0, (t - this.state.burstAt) / 3.4));\n    const running = t - this.state.burstAt >= 0 && t - this.state.burstAt < 3.4;\n    const pulse = Math.sin(p * Math.PI);\n    const ease = (v) => 1 - Math.pow(1 - v, 3);\n\n    const dizzy = running && gag === 'dizzy';\n    const wob = (idle ? Math.sin(t * 0.9) * 0.3 : 0) + (dizzy ? Math.sin(t * 9) * 1.6 * pulse : 0);\n    const wob2 = (idle ? Math.cos(t * 0.7) * 0.2 : 0) + (dizzy ? Math.cos(t * 7) * 0.9 * pulse : 0);\n\n    const plot = (px, py, ch, ox, oy) => {\n      const x = Math.round(cx + px / ax + wob + (ox || 0) / ax);\n      const y = Math.round(cy + py + wob2 + (oy || 0));\n      if (x >= 0 && x < W && y >= 0 && y < H) buf[y * W + x] = ch;\n    };\n\n    // body radius: swells during lysis, shrinks slightly during replication\n    let rC = 2.5;\n    if (running && gag === 'lysis') rC = 2.5 + pulse * 1.6;\n\n    // stalk glyph follows the spike's direction, so the corona reads as radial\n    const STALK = ['-', '\\\\', '|', '/'];\n    const stalkFor = (a) => {\n      const q = ((a % Math.PI) + Math.PI) % Math.PI;\n      return STALK[Math.round(q / (Math.PI / 4)) % 4];\n    };\n    const drawVirion = (ox, oy, scale, showSpikes, docked) => {\n      const r = rC * scale;\n      // membrane — sampled densely, then thinned by the grid itself, so it\n      // always closes into a clean ring\n      for (let i = 0; i < 96; i++) {\n        const a = (i / 96) * Math.PI * 2;\n        plot(Math.cos(a) * r, Math.sin(a) * r, 'o', ox, oy);\n      }\n      // genome: one continuous coil, not scattered dots\n      const coils = 22;\n      for (let i = 0; i < coils; i++) {\n        const u = i / (coils - 1);\n        const a = u * Math.PI * 3.4 + t * 0.35;\n        const rr = (r - 0.9) * (0.25 + 0.75 * u);\n        plot(Math.cos(a) * rr, Math.sin(a) * rr, '·', ox, oy);\n      }\n      if (!showSpikes) return;\n      const spin = idle ? t * 0.1 : 0;\n      for (let i = 0; i < SPIKES; i++) {\n        const a = (i / SPIKES) * Math.PI * 2 + spin + (dizzy ? t * 2.4 * pulse : 0);\n        const bob = idle ? Math.sin(t * 1.6 + i * 0.8) * 0.09 : 0;\n        const sx = Math.cos(a), sy = Math.sin(a);\n        plot(sx * (r + 0.8 + bob), sy * (r + 0.8 + bob), stalkFor(a), ox, oy);\n        plot(sx * (r + 1.7 + bob), sy * (r + 1.7 + bob), docked ? '×' : 'O', ox, oy);\n      }\n    };\n\n    if (running && gag === 'replicate') {\n      const d = Math.sin(p * Math.PI) * 4.2;\n      drawVirion(-d, 0, 1 - 0.15 * Math.sin(p * Math.PI), true, false);\n      drawVirion(d, 0, 1 - 0.15 * Math.sin(p * Math.PI), true, false);\n    } else if (running && gag === 'lysis' && p > 0.5) {\n      // burst into fragments, then reassemble\n      const q = (p - 0.5) / 0.5;\n      const spread = Math.sin(q * Math.PI) * 6;\n      for (let i = 0; i < 22; i++) {\n        const a = (i / 22) * Math.PI * 2 + i;\n        const rr = rC + spread * (0.5 + this.noise(i, 7, 2));\n        plot(Math.cos(a) * rr, Math.sin(a) * rr, i % 4 === 0 ? '~' : '·');\n      }\n      drawVirion(0, 0, Math.max(0.15, 1 - Math.sin(q * Math.PI)), false, false);\n    } else {\n      const docked = running && gag === 'antibody' && p > 0.42 && p < 0.9;\n      drawVirion(0, 0, 1, true, docked);\n    }\n\n    // incoming antibodies\n    if (running && gag === 'antibody') {\n      for (let i = 0; i < SPIKES; i += 2) {\n        const a = (i / SPIKES) * Math.PI * 2 + t * 0.14;\n        const arrive = Math.min(1, p / 0.42);\n        const r = 9 + (rC + 2.6 - 9) * ease(arrive);\n        const rel = p > 0.9 ? (p - 0.9) / 0.1 * 5 : 0;\n        plot(Math.cos(a) * (r + rel), Math.sin(a) * (r + rel), 'Y');\n      }\n    }\n    // sneeze: droplets spraying to the lower right\n    if (running && gag === 'sneeze') {\n      for (let i = 0; i < 7; i++) {\n        const a = 0.35 + i * 0.11;\n        const r = rC + 1 + ease(Math.min(1, p * 1.6)) * (5 + i * 0.9);\n        if (p < 0.85) plot(Math.cos(a) * r, Math.sin(a) * r, i % 2 ? '·' : '˙');\n      }\n    }\n\n    // At rest the virion half-dissolves: most characters drop out, a few\n    // sparkle back in and drift, so it only ever hints at itself.\n    const resting = t > 5 && !this.state.hover && !running;\n    if (resting && idle) {\n      const period = 7.5;\n      const ph = ((t - 5) % period) / period;\n      // a diagonal light sweep travels across the virion; only what it touches\n      // (plus a steady skeleton of every third character) stays lit\n      const sweep = -W * 0.6 + ph * (W * 2.2);\n      for (let i = 0; i < buf.length; i++) {\n        if (buf[i] === ' ') continue;\n        const gx = i % W, gy = Math.floor(i / W);\n        const d = Math.abs(gx + (gy - cy) * 0.8 - sweep);\n        const lit = Math.max(0, 1 - d / 4.2);\n        const skeleton = (gx + gy * 2) % 5 === 0;\n        if (lit > 0.72) buf[i] = '*';\n        else if (lit > 0.22 || skeleton) { /* keep as drawn */ }\n        else buf[i] = ' ';\n      }\n    }\n\n    let out = '';\n    for (let y = 0; y < H; y++) {\n      out += buf.slice(y * W, y * W + W).join('');\n      if (y < H - 1) out += '\\n';\n    }\n    return out;\n  }\n\n  renderVals() {\n    const t = this.state.tick;\n    const open = this.state.open, mountedS = this.state.mounted;\n    const rows = {}, fade = {}, mark = {}, toggle = {}, key = {}, mounted = {};\n    const IDS = ['studies', 'jobs', 'igem', 'zotero', 'reach'];\n    const set = (id) => {\n      const isOpen = !!open[id];\n      rows[id] = isOpen ? '1fr' : '0fr';\n      fade[id] = isOpen ? 1 : 0;\n      mark[id] = isOpen ? '[−]' : '[+]';\n      mounted[id] = !!mountedS[id];\n      toggle[id] = () => {\n        const willOpen = !this.state.open[id];\n        if (willOpen) {\n          this.setState(s => ({ mounted: Object.assign({}, s.mounted, { [id]: true }) }));\n          requestAnimationFrame(() => this.setState(s => ({ open: Object.assign({}, s.open, { [id]: true }) })));\n          // wait out the unfold + the typing before anything heavy is allowed in\n          clearTimeout(this['ready_' + id]);\n          this['ready_' + id] = setTimeout(() => this.setState(s => ({\n            panelReady: Object.assign({}, s.panelReady, { [id]: true })\n          })), 1250);\n        } else {\n          this.setState(s => ({\n            open: Object.assign({}, s.open, { [id]: false }),\n            panelReady: Object.assign({}, s.panelReady, { [id]: false })\n          }));\n          clearTimeout(this['ready_' + id]);\n          this.resetPanelWins(id);\n          clearTimeout(this['tm_' + id]);\n          this['tm_' + id] = setTimeout(() => this.setState(s => ({ mounted: Object.assign({}, s.mounted, { [id]: false }) })), 460);\n        }\n      };\n      key[id] = (e) => {\n        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle[id](); }\n      };\n    };\n    IDS.forEach(set);\n    const handler = {\n      get: (target, id) => {\n        if (typeof id !== 'string') return undefined;\n        if (!(id in target)) set(id);\n        return target[id];\n      }\n    };\n    const running = t - this.state.burstAt < 3.4;\n    const resting = t > 5 && !this.state.hover && !running;\n    const win = {};\n    this.winVals('igem', win);\n    this.winVals('ted', win);\n    return Object.assign(win, {\n      tree: TREE,\n      dots: DOTS[Math.floor((t || 0) * 3) % DOTS.length],\n      clock: this.state.clock,\n      theme: this.state.theme,\n      themeLabel: this.state.theme === 'dark' ? '☀ LIGHT' : '☾ DARK',\n      toggleTheme: this.toggleTheme,\n      glyph: this.buildGlyph(t),\n      glyphOpacity: resting ? 0.75 : 1,\n      glyphTitle: running ? TITLES[this.state.gag] : 'click me',\n      copiedNote: this.state.copied ? 'copied' : '',\n      copiedOpacity: this.state.copied ? 1 : 0,\n      mailAddr: this.state.mailAddr || '',\n      mailHref: 'mailto:' + (this.state.mailAddr || ''),\n      mailDone: !!this.state.mailAddr,\n      mailPending: !this.state.mailAddr,\n      mailLabel: MAIL_LABEL[this.state.mailState || 'idle'] || MAIL_LABEL.idle,\n      mailBusy: this.state.mailState === 'busy',\n      revealMail: this.revealMail,\n      revealMailKey: (e) => {\n        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.revealMail(); }\n      },\n      turnstileRef: (el) => { this.tsEl = el; },\n      copyMail: (e) => {\n        if (!navigator.clipboard || !this.state.mailAddr) return;\n        e.preventDefault();\n        navigator.clipboard.writeText(this.state.mailAddr).then(() => {\n          this.setState({ copied: true });\n          clearTimeout(this.copyTm);\n          this.copyTm = setTimeout(() => this.setState({ copied: false }), 1800);\n        });\n      },\n      plate: this.plateStr(),\n      plateIn: () => this.growPlate(),\n      frameArrow: this.state.frameHover ? 1 : 0.3,\n      tedArrow: this.state.tedHover ? 1 : 0.3,\n      onTedIn: () => this.setState({ tedHover: true }),\n      onTedOut: () => this.setState({ tedHover: false }),\n      onFrameIn: () => this.setState({ frameHover: true }),\n      onFrameOut: () => this.setState({ frameHover: false }),\n      onGlyphIn: () => this.setState({ hover: true }),\n      onGlyphOut: () => this.setState({ hover: false }),\n      onGlyphClick: () => {\n        if (t - this.state.burstAt < 1.2) return;\n        const next = GAGS[Math.floor(Math.random() * GAGS.length)];\n        this.setState({ burstAt: t, gag: next === this.state.gag ? GAGS[(GAGS.indexOf(next) + 1) % GAGS.length] : next });\n      },\n      ro
