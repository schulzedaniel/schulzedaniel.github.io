<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profiles</title>
    <style>
        /* CSS Variables for easy theme switching */
        :root {
            --bg-color: #f7f9fc;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #4b5563;
            --bsky-color: #01A6FF;
            --linkedin-color: #0A66C2;
        }

        /* Basic Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Mobile-First Card Container */
        .card-container {
            max-width: 400px;
            width: 100%;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.06);
            text-align: center;
            
            /* Initial state for JS animation */
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.7s ease-out, transform 0.7s ease-out;
        }

        /* Class added by JavaScript */
        .card-container.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Profile Avatar / Icon */
        .avatar {
            width: 80px;
            height: 80px;
            background: #e5e7eb;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
        }

        /* Typography */
        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .welcome-text {
            font-size: 16px;
            line-height: 1.5;
            color: var(--text-muted);
            margin-bottom: 32px;
        }

        /* Links/Buttons Layout */
        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 32px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            text-decoration: none;
            color: #ffffff;
            font-weight: 600;
            font-size: 16px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .social-btn:active {
            transform: scale(0.97);
        }

        .btn-linkedin {
            background-color: var(--linkedin-color);
            box-shadow: 0 4px 15px rgba(10, 102, 194, 0.25);
        }

        .btn-bluesky {
            background-color: var(--bsky-color);
            box-shadow: 0 4px 15px rgba(1, 166, 255, 0.25);
        }

        .social-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* Call to Action */
        .cta-text {
            font-weight: 700;
            font-size: 18px;
            color: var(--text-main);
            background: #f3f4f6;
            padding: 12px;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <div class="card-container" id="mainCard">
        <div class="avatar">👋</div>
        <h1>Hello there!</h1>
        <p class="welcome-text">Hey, thanks for checking out the QR Code! Here you can find my LinkedIn and Bluesky profiles.</p>
        
        <div class="links-wrapper">
            <!-- Replace "#" with your actual LinkedIn URL -->
            <a href="https://www.linkedin.com/in/daniel-a-schulze-550910205" class="social-btn btn-linkedin" target="_blank" rel="noopener noreferrer">
                <svg viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.225 0z"/></svg>
                LinkedIn
            </a>
            
            <!-- Replace "#" with your actual Bluesky URL -->
            <a href="https://bsky.app/profile/daniel-schulze.bsky.social" class="social-btn btn-bluesky" target="_blank" rel="noopener noreferrer">
                <svg viewBox="0 0 360 320" xmlns="http://www.w3.org/2000/svg"><path d="M180 141.964C163.699 104.662 117.552 20.6201 43.903 0.244236C5.56422 -10.3662 0 4.95872 0 32.222C0 98.7115 11.602 114.718 87.311 133.582C43.323 140.476 0.1001 154.685 0.0024 199.153C-0.1069 248.86 43.323 273.909 84.75 240.214C122.115 209.824 162.77 150.155 180 141.964C197.23 150.155 237.885 209.824 275.25 240.214C316.677 273.909 360.107 248.86 360.002 199.153C359.9 154.685 316.677 140.476 272.689 133.582C348.398 114.718 360 98.7115 360 32.222C360 4.95872 354.436 -10.3662 316.097 0.244236C242.448 20.6201 196.301 104.662 180 141.964Z"/></svg>
                Bluesky
            </a>
        </div>
        
        <p class="cta-text">I count on your vote! 🗳️</p>
    </div>

    <!-- JavaScript for UI enhancements -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Adds a smooth pop-in animation when the user opens the page
            setTimeout(() => {
                document.getElementById('mainCard').classList.add('visible');
            }, 100);
        });
    </script>
</body>
</html>
