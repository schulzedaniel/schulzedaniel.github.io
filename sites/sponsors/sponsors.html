<!DOCTYPE html><html lang="en"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sponsors — TEDxKI</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/sites/sponsors/sponsors.css">
  <link rel="icon" href="/assets/favicon.ico">
  <script defer="" src="/partials/includes.js"></script>
  <script defer="" src="/app.js"></script>
  <script defer="" src="/sites/sponsors/sponsors.js"></script>
</head>
<body>

  <site-header></site-header>

  <social-strip></social-strip>

  <main>
    <section class="safe-pad" aria-label="Sponsorship status">
      <div class="container">
        <img class="sponsor-hero-image" src="/assets/images/UnderConstruction.png" alt="Sponsorship page under construction">
      </div>
    </section>

    <section class="sponsor-email safe-pad" aria-label="Get in touch about sponsorship">
      <div class="container sponsor-email__wrap">
        <h2 class="sponsor-email__title">Stay in the loop</h2>
        <div class="sponsor-email__card" role="region" aria-labelledby="sponsor-email-head">
          <h3 id="sponsor-email-head">Want to support TEDxKI?</h3>
          <p>We are working around the clock on this part of the site to realize the 2026 TEDxKI event. If you want to get in touch with our sponsoring team sooner, tap the button below.</p>
          <a class="mailto cta" href="mailto:financeteam@tedxki.com?subject=Sponsorship%20inquiry" aria-label="Send an email about sponsorship to the finance team at tedxki dot com">
            ✉️ financeteam@tedxki.com
          </a>
        </div>
      </div>
    </section>
  </main>

  <site-footer></site-footer>



</body></html>
