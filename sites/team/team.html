<!DOCTYPE html><html lang="en"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Team — TEDxKI</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/sites/team/team.css">
  <link rel="icon" href="/assets/favicon.ico">
  <script defer="" src="/partials/includes.js"></script>
  <script src="/app.js" defer=""></script>
  <script src="/sites/team/team.js" defer=""></script>
</head>
<body>

  <site-header></site-header>

  <social-strip></social-strip>

  <main>
    <!-- ===== team-showcase (replace old hero) ===== -->
    <section class="team-showcase" aria-label="Team Showcase">
      <!-- Inner wrapper centers content and defines the content width -->
      <div class="team-inner">
        <!-- Row 1: visual stack (rect + image). Both absolutely positioned inside .team-stack -->
        <div class="team-stack" aria-hidden="true">
          <div class="team-bg-rect" aria-hidden="true"></div>

          <div class="team-image-wrap" aria-hidden="true">
            <img src="/assets/images/team/team_photo.png" alt="Team hero" class="team-image" loading="eager">
          </div>
        </div>

        <!-- Row 2: text content — left-aligned within same centered inner width -->
        <div class="team-text">
          <h1 class="team-title animate-once" data-anim="reveal-up">TEAM<span class="sup">x</span></h1>

          <p class="team-intro animate-once" data-anim="fade-in">
            Lorem ipsum dolor sit amet, consectetur adipiscing elit. Integer posuere erat a ante.
          </p>
        </div>
      </div>
    </section>
<!-- ===== end team-showcase ===== -->      

    <section class="team-grid container safe-pad" id="teamGrid">
      <div class="cols">
        <div class="col col-1"><article class="team-card"><div class="portrait-wrap animate-once" data-anim="slide-up" data-reveal-index="0"><img class="portrait" src="https://images.ctfassets.net/4fo2kk5ozptr/CwkxOB03nDMy29Z9J2QyV/153e06d4d8a45153f3898819b6fa2ecd/image.png?fm=webp&amp;q=80&amp;w=900" alt="Lucia Adam — Co-Lead"><a class="linkedin" href="https://www.linkedin.com/in/lucia-adam" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn Lucia Adam"><img src="/assets/logos/social/LI-In-Bug.png" alt="LinkedIn"></a><div class="card-label"><span class="name">Lucia<span class="sup">x</span></span><span class="role">Co-Lead</span></div></div></article></div>
        <div class="col col-2"></div>
        <div class="col col-3"></div>
        <div class="col col-4"></div>
      </div>
    </section>

  </main>

  <site-footer></site-footer>




</body></html>
